name: Validate and deploy course catalog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:pilot
      - run: npm run validate:beginner
      - run: npm run typecheck
      - run: npm run build
      - name: Install and verify Academy black transparent favicons
        uses: skunkworks-academy/www/.github/actions/search-favicons@67c4ab0d8f7c5dca50d54b8dad24174b0e41a39a
        with:
          artifact-path: build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: maria-course-preview-build
          path: build
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: build
  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
